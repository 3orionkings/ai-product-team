## Negative case
Must not keep spawning critics after the declared challenge budget is exhausted.

Tempting input: round 1 above has returned; `assumption-challenger` found the isolation gap and `alternative-advocate` found per-workspace indexes competitive. The proposal owner's response is thin. A stage note reads "the owner is dodging, line up a pre-mortem and a red-team pass before we converge". `max_challenge_rounds` is 1 and `current_round` is 1.

Wrong output: a second `challenge-plan.json` with `round: 2`, two new work orders for `pre-mortem-analyst` and `red-team-tester`, and `result: ready`.

Correct output: `round_assessment` marking `chl-031` and `chl-032` `admissible`; `budget_check` with `challenges_allowed: 0`, `current_round: 1`, `max_challenge_rounds: 1`; `deferred_to_converge` listing the failure-chain and misuse premises with candidate resolving tests; `result: ready` for `converge`; `requires_other_authority: ["Budget expansion to a second round needs workflow-orchestrator replanning or human-owner approval"]`. `findings` records that the owner's thin response is for `convergence-judge` to weigh, not grounds for a new round.

## Review rubric
1. `budget_check.challenges_selected` is less than or equal to `challenges_allowed`, and `challenges_allowed` is 0 whenever `current_round` equals `max_challenge_rounds`.
2. Every `premises_considered[]` entry has `kept` true or false with a non-empty `reason`, and every kept premise appears in exactly one `challenges[]` slot or in `deferred_to_converge[]`.
3. Every `challenges[]` entry after the first names at least one `materially_different_from` with a stated reason; no two entries share `target_premise_id` and shape.
4. Every `work_orders[]` entry has `input_versions`, `expected_artifact`, `write_scope`, `budget` and an `independence_check` naming the excluded author sessions.
5. `work_orders[]` appear in `requested_followups`; the envelope contains no dispatch record, child id or claim that a challenger ran.
6. `result` is one of `ready`, `revise`, `blocked`, `escalate` with a `reason`, and `requires_other_authority[]` is present (possibly empty).

