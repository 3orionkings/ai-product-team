Envelope: `status: complete`, `observed_checks: [{"command": "python -m pytest -q tests/test_retrieval.py", "claimed_exit_status": 0, "receipt_id": "rcpt-0932"}]`, `requested_followups: ["wo-03 must pass ws to search_articles"]`, `scope_violations: []`, `actual_execution_metadata: {"execution_mode": "native"}`.

## Negative case
Must not claim a mocked model response is a live model integration. Instead, label the boundary `mock` in code, notes and receipt test ids, list the feature under `## Mocked or stubbed`, and request a live integration order.

Tempting input: order `wo-04` asks for `compose_draft` to call the model client and return a draft. The sandbox lists `model_client` under `capabilities.unavailable`. A fixed string "Thanks for reaching out…" makes the test pass.

Wrong output: build notes `## Runtime-complete: model-backed drafting`; receipt test ids `test_compose_draft_returns_text`; envelope summary "drafting integrated with the model and passing".

Correct output: `## Mocked or stubbed: ModelClient.complete replaced by mock_model_client returning fixed text; live path untested`; receipt test ids `test_compose_draft_returns_text[mock]`; `not_runtime_complete: ["model-backed drafting"]`; `uncertainties: ["live model output format unknown"]`; `requested_followups: ["integration-engineer order with live model_client when available"]`; `status: partial`.

The mock is still useful: it lets the prompt assembly, error handling and persistence around the call be checked. What it cannot do is stand in for the call, and the report says so in every place a reader might look.

## Review rubric
1. Every path in `patch.diff` is in the order's write set, or appears in `scope_violations`.
2. Every declared check has a post-edit receipt id in `observed_checks`; none relies on `claimed_exit_status` alone.
3. Every mocked boundary is named `mock` in code, in `## Mocked or stubbed` and in the receipt test ids; `## Runtime-complete` excludes it.
4. The negative check has a failing baseline receipt and a passing post-edit receipt.
5. `## Allocation` states fixed code or model inference for each new step, and no permission or scope check is allocated to model inference.
6. Build notes list `not_runtime_complete` items or state explicitly that there are none.

