  | python -m pytest -q tests/test_retrieval.py | 4f2c9a1 (baseline) | 1 | rcpt-0931 | test_ws_alpha_cannot_see_ws_beta FAILED (expected: filter absent) |
  | python -m pytest -q tests/test_retrieval.py | 4f2c9a1+dirty:9be0…c1 | 0 | rcpt-0932 | 3 passed |

  ## Residual risks
