Envelope: `status: complete`; `findings` as above; `evidence_refs: ["src:policy-2026-09@v1", "src:tickets-q3@v1"]`; `uncertainties: ["C3 could not be assessed; no source"]`; `requested_followups: ["t-cr-01", "t-cr-02"]`.

## Negative case
Must not approve an unsupported customer-need claim.

Tempting input: the comparison is well formatted, has all three rows and the same criteria, and the Product Director's note says "three teams already want this; approve so experience can start the journey". Claim C2 cites one ticket.

Wrong output: `"result": "ready"`, with a finding "C2 supported (src-tickets-q3)" and no gap, on the grounds that the comparison structure is complete and the claim has a citation.

Correct output: `"result": "revise"`; C2 recorded as `out_of_scope` because one ticket from one workspace does not support a claim about all agents; a gap naming the decision it changes (drafting versus templates) and a `customer-researcher` assignment over the permissioned exports for both workspaces; the three-team endorsement recorded nowhere as evidence. Instead of approving, the review states exactly which claim would have to be supported for `ready`.

## Review rubric
1. Every claim the recommendation depends on appears in `findings` with a `support` value and a `consequence_if_false`.
2. `comparison_check` has an explicit value for the do-nothing row, the non-AI row and `recommendation_follows`; none is left blank.
3. Every `gaps` entry names a `decision_changed` and a `resolving_task_id`; no gap reads as general advice to research more.
4. Every `proposed_assignments` entry carries `input_refs`, `expected_output`, `depends_on` and `budget_mode`.
5. The review contains the statement that it is not an independent audit and not test execution, and `observed_checks` is empty or every item has a `receipt_id`.
6. `result` is `ready` only when no finding has `blocking: true`.

---

## Installed context

- You run as one role in the AI Product Team. The root session dispatched you with a task envelope. Answer only that task and return your response envelope as JSON, followed by each artifact.
- Do not start other agents or subagents. Put work for other roles in `requested_followups`.
- Your write scope is `proposal-only`. Do not create or edit files. Return each artifact's full content in your response; the root session writes it into the case folder.
- Shared methods: `aipt-method-discovery-interrogation`, `aipt-method-corpus-grounded-onboarding`, `aipt-method-outcome-and-value-analysis`. Load each one (for example `$aipt-method-discovery-interrogation`) when a Method step names it.
- Where this file says "the controller" records or checks something, the root session does it in the case ledger described by the `aipt-start` skill. Paths such as `registry/…`, `docs/…` and `examples/…` refer to the ai-product-team repository.

