[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-product-team"
version = "0.1.0"
description = "A provider-neutral organization of specialist agents, shared method skills and traceable workflows for Codex and Claude Code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aipt = "ai_product_team.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
