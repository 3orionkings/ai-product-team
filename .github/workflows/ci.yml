name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Authoring checks
        run: |
          python tools/check_authoring.py agents
          python tools/check_authoring.py skills
      - name: Generated files are current
        run: python tools/build_adapters.py --check
      - name: Tests
        run: PYTHONPATH=src python -m unittest discover -s tests -t .
